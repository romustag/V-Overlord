<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>V-Overlord · Galerie 3D</title>
    <style>
      body { margin: 0; background: #2a2144; color: #fff; font: 12px/1.3 system-ui, sans-serif; }
      h2 { margin: 10px 12px 0; font-size: 14px; }
      .grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; }
      .cell { width: calc(var(--s, 150) * 1px); text-align: center; background: radial-gradient(ellipse at 50% 90%, #5b4a8a, #3a2f5e); border-radius: 8px; padding: 4px 0; }
      .box { position: relative; width: calc(var(--s, 150) * 1px); height: calc(var(--s, 150) * 1.25px); container-type: size; }
      .rig { --rig-ratio: 0.8; position: absolute; left: 50%; bottom: 0; width: min(100cqw, calc(100cqh * var(--rig-ratio))); aspect-ratio: var(--rig-ratio); translate: -50% 0; }
      .rig canvas { position: absolute; bottom: -5%; left: 50%; translate: -50% 0; height: 125%; width: auto; }
      .flip .rig { scale: -1 1; }
    </style>
  </head>
  <body>
    <script>window.ACTOR3D_BLOB = true;</script>
    <script type="module" src="three/index.js?v=53"></script>
    <div id="app"></div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const weapon = params.get("weapon");
      const coating = params.get("coating") ?? "aucun";
      const classes = (params.get("state") ?? "").split(",").filter(Boolean);
      document.documentElement.style.setProperty('--s', params.get('size') ?? 150);
      const only = params.get("only")?.split(",");
      await new Promise((resolve) => (window.Actor3D?.ready ? resolve() : window.addEventListener("actor3d-ready", resolve)));
      const heroes = "survivant pisteur secouriste sentinelle aventuriere cendre chevalier citrouille clown cowboy cyborg demon epouvantail fantome faucheuse feuillage garde-forestier loup mecanicien momie ninja nomade pirate renard samourai squelette sorciere vampire viking zombie astronaute chasseur-vampires maisie-draconique".split(" ");
      const enemies = "citrouille citrouille-vive grosse-citrouille minion-squelette minion-gargouille minion-ombre minion-bouffon minion-archer-ombre minion-soldat-ombre minion-goule-ombre boss-fossoyeur boss-epouvantail boss-cauchemars boss-bouffon boss-chambellan".split(" ");
      const weapons = "fronde double-fronde arc-long arbalete fusil-pompe lance-clous lance-bonbons faux-spectrale fouet-ronces tir-chauve-souris lanterne-ames grimoire-maudit epee-rouillee epee-chevalier coutelas-fantome lame-braise epee-lune-sanglante pistolet-silex revolver-sherif pistolet-citrouille pistolet-spectral canon-roi-ombres hache-bucheron lance-centurion marteau-guerre dague-assassin katana-ombre tromblon-pirate fusil-precision pistolet-givre baguette-foudre blaster-neon".split(" ");
      const app = document.getElementById("app");
      function section(title, items, make) {
        if (only && !only.includes(title)) return;
        const h = document.createElement("h2");
        h.textContent = title;
        const grid = document.createElement("div");
        grid.className = "grid";
        app.append(h, grid);
        const names = params.get('names')?.split(',');
        for (const item of items) {
          if (names && !names.includes(item)) continue;
          const cell = document.createElement("div");
          cell.className = "cell";
          const box = document.createElement("div");
          box.className = "box";
          const owner = document.createElement("div");
          owner.className = `player ${classes.join(" ")}`;
          owner.style.cssText = "position:absolute;inset:0";
          if (params.get("pose")) owner.dataset.pose = params.get("pose");
          const rig = document.createElement("span");
          rig.className = "rig";
          owner.append(rig);
          box.append(owner);
          cell.append(box, document.createTextNode(item));
          grid.append(cell);
          make(rig, item);
        }
      }
      section("heroes", heroes, (rig, name) => {
        window.Actor3D.mount(rig, `heros/${name}`);
        window.Actor3D.setWeapon(rig, weapon ?? "revolver-sherif", coating);
      });
      section("enemies", enemies, (rig, name) => window.Actor3D.mount(rig, name));
      section("weapons", weapons, (rig, name) => {
        window.Actor3D.mount(rig, "heros/survivant");
        window.Actor3D.setWeapon(rig, name, coating);
      });
    </script>
  </body>
</html>
